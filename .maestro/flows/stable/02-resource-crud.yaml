appId: com.echowave.app
name: stable-resource-crud
tags:
  - stable
---
- runFlow: ../../subflows/prepare-e2e-app.yaml
- startRecording:
    path: 'stable-resource-crud'
    optional: true
- tapOn:
    id: 'e2e-tab-groups'
- tapOn: '菜单'
- tapOn: '添加分组'
- tapOn: '分组名称'
- inputText: '${GROUP_NAME}'
- hideKeyboard
- tapOn: '创建'
- extendedWaitUntil:
    visible: '${GROUP_NAME}'
    timeout: 30000
- takeScreenshot: 'stable/02-group-created'
- tapOn:
    id: 'e2e-tab-knowledge'
- tapOn:
    id: 'e2e-new-knowledge-base'
- tapOn: '知识库名称'
- inputText: '${KB_NAME}'
- tapOn: '知识库描述'
- inputText: 'E2E deterministic knowledge base'
- hideKeyboard
- tapOn: '创建并打开'
- extendedWaitUntil:
    visible: '${KB_NAME}'
    timeout: 30000
- takeScreenshot: 'stable/02-knowledge-created'
- pressKey: BACK
- tapOn:
    id: 'e2e-tab-sources'
- tapOn:
    id: 'e2e-new-data-source'
- assertVisible: '新增数据源'
- tapOn: '数据源名称'
- inputText: '${SOURCE_NAME}'
- hideKeyboard
- tapOn: '确认'
- extendedWaitUntil:
    visible: '${SOURCE_NAME}'
    timeout: 30000
- tapOn: '关联分组'
- tapOn: '关联新分组'
- tapOn: '选择分组：${GROUP_NAME}'
- tapOn: '确认关联'
- assertVisible: '${GROUP_NAME}'
- tapOn:
    id: 'data-source-tab-uploads'
- tapOn: '上传音频'
- runFlow: ../../subflows/select-audio-file.yaml
- extendedWaitUntil:
    visible: '上传成功'
    timeout: 60000
- tapOn:
    id: 'data-source-tab-audio'
- scrollUntilVisible:
    element:
      text: '${AUDIO_TITLE}'
    direction: DOWN
    timeout: 60000
- takeScreenshot: 'stable/02-audio-uploaded'
- tapOn:
    text: '播放音频：${AUDIO_TITLE}'
- scrollUntilVisible:
    element:
      text: '${AUDIO_TITLE}更多操作'
    direction: DOWN
    timeout: 10000
- tapOn: '${AUDIO_TITLE}更多操作'
- assertVisible: '归档'
- assertVisible: 'ASR转写'
- assertVisible: 'ASR结果分析'
- tapOn: 'ASR转写'
- assertVisible: '开始 ASR 转写？'
- tapOn: '取消'
- takeScreenshot: 'stable/02-audio-actions'
- tapOn: '搜索数据源内容'
- assertVisible: '输入数据源内容搜索关键词'
- assertVisible: '执行搜索'
- takeScreenshot: 'stable/02-search-keyboard-visible'
- tapOn: '输入数据源内容搜索关键词'
- inputText: '${AUDIO_TITLE}'
- hideKeyboard
- tapOn: '执行搜索'
- assertVisible: '${AUDIO_TITLE}'
- tapOn: '搜索数据源内容'
- assertVisible: '输入数据源内容搜索关键词'
- tapOn: '清除搜索'
- tapOn: '执行搜索'
- tapOn: '更多操作'
- tapOn: '编辑数据源'
- assertVisible: '编辑数据源'
- tapOn: '数据源描述'
- inputText: 'E2E source edited'
- hideKeyboard
- tapOn: '确认'
- tapOn:
    id: 'data-source-tab-overview'
- assertVisible: 'E2E source edited'
- scrollUntilVisible:
    element:
      text: '${AUDIO_TITLE}更多操作'
    direction: DOWN
    timeout: 10000
- tapOn: '${AUDIO_TITLE}更多操作'
- tapOn: '归档'
- assertVisible: '归档音频？'
- tapOn: '归档音频'
- assertNotVisible: '${AUDIO_TITLE}'
- pressKey: BACK
- stopRecording
