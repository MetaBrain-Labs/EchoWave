appId: com.echowave.app
name: retake-knowledge-answer-citation
tags:
  - showcase-retake
---
# 必须预先打开正确知识库的已完成问答；历史弹层没有引用跳转入口。
- runFlow: ../../subflows/attach-retake-session.yaml
- assertTrue: ${typeof RETAKE_KB_NAME !== 'undefined' && RETAKE_KB_NAME.trim().length > 0}
- assertVisible: '问知识库'
- assertNotVisible: '最近问答'
- scrollUntilVisible:
    element: '${RETAKE_QUESTION_TEXT}'
    direction: UP
    centerElement: true
    timeout: 20000
- startRecording:
    path: 'retake-03-knowledge-answer-citation'
- takeScreenshot: 'retake/03-existing-question'
- scrollUntilVisible:
    element: '${RETAKE_ANSWER_TEXT}'
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible: '[1-9][0-9]*条引用来源'
- takeScreenshot: 'retake/03-grounded-answer'
- scrollUntilVisible:
    element: '${RETAKE_CITATION_TEXT}'
    direction: DOWN
    centerElement: true
    timeout: 20000
- takeScreenshot: 'retake/03-citation-source'
- tapOn: '${RETAKE_CITATION_TEXT}'
- extendedWaitUntil:
    visible: '块详情'
    timeout: 30000
- scrollUntilVisible:
    element: '${RETAKE_SOURCE_TEXT}'
    direction: DOWN
    centerElement: true
    timeout: 20000
- takeScreenshot: 'retake/03-source-block'
- scrollUntilVisible:
    element: '${RETAKE_SOURCE_LOCATION_TEXT}'
    direction: DOWN
    timeout: 20000
- takeScreenshot: 'retake/03-source-location'
- tapOn: '定位原文'
- assertVisible: '文档原文'
- tapOn: '文档原文'
- extendedWaitUntil:
    visible: '${RETAKE_DOCUMENT_TITLE}'
    timeout: 30000
- assertVisible:
    id: 'document-preview'
- scrollUntilVisible:
    element: '${RETAKE_ORIGINAL_TEXT}'
    direction: DOWN
    timeout: 20000
- takeScreenshot: 'retake/03-source-original-location'
- pressKey: BACK
- assertVisible: '问知识库'
- pressKey: BACK
- assertVisible: '${RETAKE_KB_NAME}'
- scrollUntilVisible:
    element: '打开文件：${RETAKE_DOCUMENT_TITLE}'
    direction: DOWN
    timeout: 20000
- takeScreenshot: 'retake/03-business-document-library'
- stopRecording
