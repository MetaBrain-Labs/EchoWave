appId: com.echowave.app
name: showcase-knowledge-rag
tags:
  - showcase
---
- runFlow: ../../subflows/prepare-e2e-app.yaml
- startRecording:
    path: 'showcase-knowledge-rag'
    optional: true
- tapOn:
    id: 'e2e-tab-knowledge'
- tapOn:
    id: 'e2e-new-knowledge-base'
- tapOn: '知识库名称'
- inputText: '${SHOWCASE_KB_NAME}'
- tapOn: '知识库描述'
- inputText: 'Product research knowledge with traceable citations'
- hideKeyboard
- tapOn: '创建并打开'
- extendedWaitUntil:
    visible: '${SHOWCASE_KB_NAME}'
    timeout: 30000
- tapOn: '关联分组'
- tapOn: '关联新分组'
- tapOn: '选择分组：${SHOWCASE_GROUP_NAME}'
- tapOn: '确认关联'
- assertVisible: '${SHOWCASE_GROUP_NAME}'
- tapOn:
    id: 'knowledge-detail-tab-files'
- tapOn: '上传文档'
- runFlow: ../../subflows/select-knowledge-file.yaml
- extendedWaitUntil:
    visible: '解析完成'
    timeout: 600000
- takeScreenshot: 'showcase/03-document-ready'
- tapOn: '问知识库'
- tapOn: '输入知识库问题'
- inputText: 'What is the EchoWave verification code?'
- hideKeyboard
- tapOn: '发送问题'
- extendedWaitUntil:
    visible: 'ECHO-4827'
    timeout: 300000
- assertVisible: '.*条引用来源'
- takeScreenshot: 'showcase/03-answer-with-citation'
- tapOn: "\\[1\\] EchoWave-Product-Brief.md"
- assertVisible: '原文'
- takeScreenshot: 'showcase/03-citation-open'
- stopRecording
