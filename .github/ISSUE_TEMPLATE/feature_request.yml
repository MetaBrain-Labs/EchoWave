name: Feature request / 功能建议
description: Propose a scoped improvement / 提议边界清晰的改进
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem / 用户问题
      description: Describe the user and problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome / 期望结果
      description: What observable result would make this complete?
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Scope and non-goals / 范围与非目标
      description: What should and should not be included?
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints / 约束
      description: Platform, deployment region, provider lifecycle/cost, compatibility, privacy, or migration concerns.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist / 检查项
      options:
        - label: I searched existing issues and ROADMAP.md. / 我已搜索现有 Issue 与 ROADMAP.md。
          required: true
        - label: I described a user problem rather than only a preferred implementation. / 我描述了用户问题，而不只是实现偏好。
          required: true
