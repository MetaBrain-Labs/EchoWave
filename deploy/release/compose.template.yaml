name: echowave

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    restart: unless-stopped
    env_file:
      - ./api.env
    # 容量轮转：20 MB × 5，自动压缩并删除最旧文件，避免日志写满磁盘。
    logging:
      driver: local
      options:
        max-size: '20m'
        max-file: '5'
        compress: 'true'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - echowave_postgres:/var/lib/postgresql/data

  migrate:
    image: '{{IMAGE_REFERENCE}}'
    command: ['node', '--enable-source-maps', 'dist/bootstrap/migrate.js']
    restart: 'no'
    logging:
      driver: local
      options:
        max-size: '20m'
        max-file: '5'
        compress: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api.env:/app/.env:ro
      - ./.data/secrets:/app/.data/secrets:ro

  api:
    image: '{{IMAGE_REFERENCE}}'
    restart: unless-stopped
    # 结构化 JSON 日志通过 Docker local driver 轮转；LOG_LEVEL 是控制日志量的第一道闸门。
    logging:
      driver: local
      options:
        max-size: '20m'
        max-file: '5'
        compress: 'true'
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '${ECHOWAVE_API_PORT:-3001}:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    tmpfs:
      - /app/.tmp:mode=1777
    volumes:
      - ./api.env:/app/.env:ro
      - ./.data/secrets:/app/.data/secrets:ro
      - echowave_audio:/app/.data/audio
      - echowave_knowledge:/app/.data/knowledge

volumes:
  echowave_audio:
  echowave_knowledge:
  echowave_postgres:
