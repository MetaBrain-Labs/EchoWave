name: echowave

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    restart: unless-stopped
    env_file:
      - ./deploy/self-hosted/api.env
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - echowave_postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://deb.debian.org/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-http://deb.debian.org/debian-security}
    command: ['node', 'dist/bootstrap/migrate.js']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./deploy/self-hosted/api.env:/app/.env:ro
      - ./deploy/self-hosted/.data/secrets:/app/.data/secrets:ro

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://deb.debian.org/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-http://deb.debian.org/debian-security}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '${ECHOWAVE_API_PORT:-3001}:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    tmpfs:
      - /app/.tmp:mode=1777
    volumes:
      - ./deploy/self-hosted/api.env:/app/.env:ro
      - ./deploy/self-hosted/.data/secrets:/app/.data/secrets:ro
      - echowave_audio:/app/.data/audio

volumes:
  echowave_audio:
  echowave_postgres:
